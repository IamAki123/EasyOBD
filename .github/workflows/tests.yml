name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Default still requests the obsolete `tools` package, which sdkmanager no longer ships.
          packages: 'platform-tools'
      - name: Run unit tests and assemble the library
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon
